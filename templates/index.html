<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Diary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Film Diary</h1>

    <form method="POST">
        <input 
        type="text" name="movie" placeholder="Enter a movie">

        <button type="submit">Search</button>

    </form>

    <h2>Search Results</h2>
    {%for movie in movies %}
        <h3 id="title"><strong>{{ movie["title"]}}</strong></h3> 
        <p id="release-date">{{ movie["release_date"] }}</p>
        <img id="poster" src="https://image.tmdb.org/t/p/w500{{ movie['poster_path'] }}" alt="Movie Poster">
        <a href = "{{ url_for('moviePage', movieId=movie['id']) }}">View film</a>
        <hr>
        
    {%endfor%}

</body>
</html>
